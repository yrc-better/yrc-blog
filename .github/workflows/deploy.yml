name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout blog
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static analysis (repo-check, lint, rule tests, types)
        run: npm run check

      - name: Checkout band simulator
        uses: actions/checkout@v4
        with:
          repository: yrc-better/stay-for-the-encore
          ref: main
          path: .build/stay-for-the-encore

      - name: Build band simulator into public/
        working-directory: .build/stay-for-the-encore
        env:
          VITE_BASE_PATH: /yrc-blog/projects/band-simulator/
          VITE_PUBLIC_SITE_URL: https://yrc-better.github.io/yrc-blog/projects/band-simulator/
        run: |
          npm ci
          npm run build:blog
          rm -rf "$GITHUB_WORKSPACE/public/projects/band-simulator"
          mkdir -p "$GITHUB_WORKSPACE/public/projects/band-simulator"
          cp -R dist/client/. "$GITHUB_WORKSPACE/public/projects/band-simulator/"

      - name: Build site
        run: npm run build

      - name: Install Chromium for verification
        run: npx playwright install --with-deps chromium

      - name: Runtime verification (feature map)
        run: npm run verify

      - name: UI fuzzing
        run: npm run fuzz -- --runs 3 --steps 60

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof
          path: proof/
          retention-days: 14

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
